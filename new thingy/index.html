    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0e17; color: #eef2f8; height:100vh; overflow:hidden;
      user-select: none;
    }
    #app { display:flex; flex-direction:column; height:100vh; position:relative; }
    #topbar {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 20px; background:rgba(11,14,23,0.92); backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.06); z-index:1000;
      flex-shrink:0; flex-wrap:wrap; gap:8px;
    }
    #topbar .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:17px; color:#c8d8f0; }
    #topbar .brand .badge {
      background:rgba(64,128,255,0.18); padding:3px 12px; border-radius:100px;
      font-size:10px; font-weight:500; color:#6a9aff; text-transform:uppercase; letter-spacing:0.3px;
    }
    #topbar .controls { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .pill-btn {
      appearance:none; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
      padding:6px 16px; border-radius:100px; color:#bcc9dd; font-size:12px; font-weight:500;
      cursor:pointer; transition:all .25s ease; backdrop-filter:blur(4px);
      font-family:inherit; display:inline-flex; align-items:center; gap:6px;
    }
    .pill-btn:hover { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.18); color:#fff; transform:translateY(-1px); }
    .pill-btn.primary { background:rgba(64,128,255,0.2); border-color:rgba(64,128,255,0.25); color:#8ab4ff; }
    .pill-btn.primary:hover { background:rgba(64,128,255,0.3); border-color:rgba(64,128,255,0.4); color:#a8c8ff; }
    .pill-btn .icon { font-size:14px; line-height:1; }
    #statusDisplay {
      font-size:12px; color:#8a9bb5; background:rgba(255,255,255,0.04);
      padding:4px 14px; border-radius:100px; border:1px solid rgba(255,255,255,0.06);
      white-space:nowrap; max-width:300px; overflow:hidden; text-overflow:ellipsis;
    }
    #map { flex:1; width:100%; background:#0b0e17; position:relative; }
    .leaflet-tile-pane { filter:brightness(0.85) contrast(1.05) saturate(0.7); }
    .leaflet-control-zoom { border:none !important; box-shadow:0 8px 32px rgba(0,0,0,0.5) !important; }
    .leaflet-control-zoom a { background:rgba(20,26,40,0.85) !important; backdrop-filter:blur(8px) !important; color:#c8d8f0 !important; border-color:rgba(255,255,255,0.06) !important; }
    #sites-bar {
      position:absolute; bottom:28px; left:50%; transform:translateX(-50%); z-index:900;
      display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
      padding:12px 18px; background:rgba(11,14,23,0.80); backdrop-filter:blur(18px);
      border-radius:60px; border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 16px 60px rgba(0,0,0,0.7); max-width:94vw; max-height:150px;
      overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.08) transparent;
    }
    #sites-bar::-webkit-scrollbar { width:4px; }
    #sites-bar::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:10px; }
    #sites-bar .site-pill {
      appearance:none; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06);
      padding:5px 14px; border-radius:100px; color:#9aabc4; font-size:11px; font-weight:500;
      cursor:pointer; transition:all .25s ease; font-family:inherit; letter-spacing:0.4px;
      text-transform:uppercase; flex-shrink:0;
    }
    #sites-bar .site-pill:hover { background:rgba(255,255,255,0.10); border-color:rgba(255,255,255,0.15); color:#d8e4f4; transform:translateY(-1px); }
    #sites-bar .site-pill.active { background:rgba(64,128,255,0.25); border-color:rgba(64,128,255,0.4); color:#fff; }
    #sites-bar .site-pill .code { font-weight:600; color:#c8d8f0; }
    #sites-bar .site-pill .name { font-weight:300; font-size:9px; opacity:0.6; margin-left:4px; text-transform:none; }
    #time-controls {
      position:absolute; bottom:100px; left:50%; transform:translateX(-50%); z-index:850;
      display:none; align-items:center; gap:10px; padding:8px 16px;
      background:rgba(11,14,23,0.72); backdrop-filter:blur(14px); border-radius:40px;
      border:1px solid rgba(255,255,255,0.06); box-shadow:0 8px 32px rgba(0,0,0,0.5);
      flex-wrap:wrap; justify-content:center;
    }
    #time-controls .btn-icon {
      background:rgba(255,255,255,0.06); border:none; color:#bcc9dd; width:32px; height:32px;
      border-radius:50%; cursor:pointer; font-size:14px; display:flex; align-items:center;
      justify-content:center; transition:all .2s;
    }
    #time-controls .btn-icon:hover { background:rgba(255,255,255,0.12); color:#fff; }
    #time-controls .btn-icon.playing { background:rgba(64,128,255,0.25); color:#8ab4ff; }
    #time-slider { width:150px; accent-color:#6a9aff; cursor:pointer; background:rgba(255,255,255,0.1); border-radius:10px; height:4px; }
    #time-index { font-size:11px; color:#8a9bb5; min-width:60px; text-align:center; }
    @media (max-width:640px) {
      #time-slider { width:90px; }
      #time-controls { padding:6px 12px; gap:6px; bottom:80px; }
      #time-controls .btn-icon { width:28px; height:28px; font-size:12px; }
      #sites-bar { padding:10px 14px; gap:5px; bottom:18px; max-height:110px; }

      .pill-btn { font-size:10px; padding:4px 12px; }
      #statusDisplay { font-size:10px; max-width:150px; }
    }
    #legend {
      position:absolute; bottom:100px; right:20px; z-index:800;
      background:rgba(11,14,23,0.72); backdrop-filter:blur(12px); border-radius:14px;
      padding:12px 14px; border:1px solid rgba(255,255,255,0.05);
      font-size:10px; color:#7a8ba5; display:none; min-width:100px;
      box-shadow:0 12px 40px rgba(0,0,0,0.5);
    }
    #legend.visible { display:block; }
    #legend .title { font-weight:500; color:#bcc9dd; margin-bottom:4px; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }
    #legend .row { display:flex; align-items:center; gap:8px; padding:2px 0; }
    #legend .swatch { width:18px; height:8px; border-radius:4px; flex-shrink:0; }
    #loading {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:800;
      background:rgba(11,14,23,0.88); backdrop-filter:blur(16px); padding:24px 40px;
      border-radius:24px; border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 32px 80px rgba(0,0,0,0.7); display:none; flex-direction:column;
      align-items:center; gap:14px; pointer-events:none;
    }
    #loading.visible { display:flex; }
    #loading .spinner {
      width:32px; height:32px; border:3px solid rgba(255,255,255,0.06);
      border-top-color:#6a9aff; border-radius:50%;
      animation:spin .9s cubic-bezier(.4,0,.2,1) infinite;

    #loading .label strong { color:#c8d8f0; }

    .leaflet-popup-content { font-size:13px!important; font-weight:500!important; }

      background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
      padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
      font-size:11px; color:#8a9bb5; max-width:400px; max-height:300px;
      overflow:auto; display:none; font-family:monospace;
      white-space:pre-wrap; word-break:break-all;
    }
    #debug-panel.visible { display:block; }
    #debug-panel strong { color:#c8d8f0; }

</head>
<body>
<div id="app">

    <span id="time-index">0 / 0</span>
  </div>
  <div id="legend">

    <div class="row"><span class="swatch" style="background:#d4a030;"></span> 30–40</div>
    <div class="row"><span class="swatch" style="background:#d46a20;"></span> 40–50</div>
    <div class="row"><span class="swatch" style="background:#c04030;"></span> 50–60</div>
    <div class="row"><span class="swatch" style="background:#8a2040;"></span> 60+</div>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <div class="label">Loading <strong id="loadingSite">KXXX</strong> …</div>
  </div>
  <div id="debug-panel"></div>
</div>

     - getHighresReflectivity([scan]) returns HighResData objects
       whose fields are: gate_count, gate_size, first_gate,
       rf_threshold, snr_threshold, scale, offset, moment_data.
       There is NO `azimuth` or `data` field on these objects.
     - Azimuths are a *separate* parallel array from getAzimuth().
     - moment_data holds raw scaled integers. Real dBZ = (raw -
       offset) / scale. Raw values of 0/1 are reserved (below
       threshold / no data) and must be skipped.
     - An elevation must be selected first with setElevation().
     - There is no getFirstGate()/getGateSpacing() on Level2Radar;

// ─── DOM refs ──────────────────────────────────────────────────────

// ─── Helpers ──────────────────────────────────────────────────────
function setStatus(text, isGood = true) {
  statusEl.textContent = text;
  statusEl.style.color = isGood ? '#8a9bb5' : '#d63d4a';
}

function showLoading(siteCode) { loadingSiteEl.textContent = siteCode || '...'; loadingEl.classList.add('visible'); state.loading = true; }
function hideLoading() { loadingEl.classList.remove('visible'); state.loading = false; }
function getSiteByCode(code) { return RADAR_SITES.find(s => s.code === code); }

// ─── Debug logging (visible on page, toggled by the Debug button) ─
let debugVisible = true;
function debugLog(msg) {
  console.log(msg);
  if (debugVisible) debugPanel.classList.add('visible');
  debugPanel.textContent += msg + '\n';
  debugPanel.scrollTop = debugPanel.scrollHeight;
}
function debugClear() { debugPanel.textContent = ''; }
btnDebug.addEventListener('click', () => {
  debugVisible = !debugVisible;
  debugPanel.classList.toggle('visible', debugVisible);
});

// ─── Proxy via Netlify Edge Function ──────────────────────────────
// IMPORTANT: this must be routed to a Netlify EDGE Function
// (netlify/edge-functions/nexrad-proxy.js), not a regular serverless
// function or a plain [[redirects]] proxy rule. Regular functions/redirects
// run through AWS Lambda and are capped at 6MB (buffered) / 20MB (streamed)
// response payloads - NEXRAD Level II files are often 5-20+MB and will get
// silently truncated mid-download on that path. Edge Functions run on Deno
// at the edge and stream responses of any size with no such cap.
async function fetchViaRedirect(url, timeoutMs = 20000) {
  const proxyUrl = '/api/nomads' + url.replace('https://nomads.ncep.noaa.gov', '');
  debugLog(`Fetching: ${proxyUrl}`);
  const t0 = performance.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(proxyUrl, { signal: controller.signal });
    const contentLength = resp.headers.get('content-length');
    debugLog(`-> HTTP ${resp.status} in ${(performance.now()-t0).toFixed(0)}ms` + (contentLength ? ` (content-length: ${(contentLength/1024/1024).toFixed(2)} MB)` : ' (no content-length header - chunked)'));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp;
  } catch (err) {
    if (err.name === 'AbortError') {
      debugLog(`-> TIMED OUT after ${timeoutMs}ms with no response`);
      throw new Error(`Request timed out after ${timeoutMs}ms (proxy or NOAA server not responding)`);
    }
    debugLog(`-> FAILED: ${err.message}`);
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// ─── All‑site markers ─────────────────────────────────────────────
function createAllSiteMarkers() {
  if (state.siteMarkers) map.removeLayer(state.siteMarkers);
  const group = L.layerGroup();
  RADAR_SITES.forEach(site => {
    const marker = L.circleMarker([site.lat, site.lon], {
      radius: 5, color: '#4a8aff', weight: 1.5, opacity: 0.8,
      fillColor: '#1a3a6a', fillOpacity: 0.7,
    });
    marker._siteCode = site.code;
    marker.bindPopup(`<b>${site.code}</b> ${site.name}`);
    marker.on('click', () => selectSite(site.code));
    group.addLayer(marker);
  });
  group.addTo(map);
  state.siteMarkers = group;
}

function updateSiteMarkerHighlight(selectedCode) {
  if (!state.siteMarkers) return;
  state.siteMarkers.eachLayer(marker => {
    const code = marker._siteCode;
    if (code === selectedCode) {
      marker.setStyle({ radius: 7, color: '#8ab4ff', weight: 3, opacity: 1, fillColor: '#4a8aff', fillOpacity: 0.9 });
      marker.openPopup();
    } else {
      marker.setStyle({ radius: 5, color: '#4a8aff', weight: 1.5, opacity: 0.8, fillColor: '#1a3a6a', fillOpacity: 0.7 });
      marker.closePopup();
    }
  });
}

// ─── Build Site Pills ─────────────────────────────────────────────
function buildSitePills() {
  sitesBar.innerHTML = '';
  RADAR_SITES.forEach(site => {
    const btn = document.createElement('button');
    btn.className = 'site-pill' + (site.code === state.selectedSite ? ' active' : '');
    btn.dataset.code = site.code;
    btn.innerHTML = `<span class="code">${site.code}</span><span class="name">${site.name}</span>`;
    btn.addEventListener('click', () => selectSite(site.code));
    sitesBar.appendChild(btn);
  });
  const active = sitesBar.querySelector('.site-pill.active');
  if (active) active.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}

// ─── Select Site ──────────────────────────────────────────────────
function selectSite(code) {
  if (state.loading) return;
  stopPlayback();
  state.selectedSite = code;
  document.querySelectorAll('.site-pill').forEach(el => el.classList.toggle('active', el.dataset.code === code));
  updateSiteMarkerHighlight(code);
  const site = getSiteByCode(code);
  if (site) map.setView([site.lat, site.lon], 8, { animate: true });
  if (state.radarLayer) { map.removeLayer(state.radarLayer); state.radarLayer = null; }
  if (state.compositeLayer) { map.removeLayer(state.compositeLayer); state.compositeLayer = null; }
  legendEl.classList.remove('visible');
  timeControls.style.display = 'none';
  state.fileList = [];
  state.parsedDataCache.clear();
  debugClear();
  fetchFileList(code);
}

// ─── Fetch File List ──────────────────────────────────────────────
async function fetchFileList(code) {
  showLoading(code);
  setStatus(`⏳ Fetching ${code} …`);
  try {
    const targetUrl = `https://nomads.ncep.noaa.gov/pub/data/nccf/radar/nexrad_level2/${code}/?C=M;O=D`;
    const resp = await fetchViaRedirect(targetUrl);
    const html = await resp.text();
    const lines = html.split('\n');
    const bz2Files = [];
    for (const line of lines) {
      const match = line.match(/href="([^"]+\.bz2)"/i);
      if (match) bz2Files.push(match[1]);
    }
    if (bz2Files.length === 0) throw new Error('No .bz2 files found');
    bz2Files.sort((a, b) => b.localeCompare(a));
    state.fileList = bz2Files;
    timeControls.style.display = 'flex';
    timeSlider.max = state.fileList.length - 1;
    timeSlider.value = 0;
    timeIndex.textContent = `1 / ${state.fileList.length}`;
    state.currentIndex = 0;
    const ok = await loadRadarFile(code, state.fileList[0]);
    legendEl.classList.add('visible');
    if (ok) setStatus(`✓ ${code} · ${state.fileList.length} scans`, true);
  } catch (err) {
    console.error('Fetch error:', err);
    setStatus(`✗ ${code} · ${err.message}`, false);
    hideLoading();
    timeControls.style.display = 'none';
    loadCompositeFallback(code);
  } finally {
    hideLoading();
  }
}

// ─── Load a specific radar file ──────────────────────────────────
async function loadRadarFile(code, filename) {
  showLoading(code);
  setStatus(`⏳ ${filename} …`);
  debugLog(`=== Loading ${filename} ===`);
  try {
    let parsed = state.parsedDataCache.get(filename);
    if (!parsed) {
      const fileUrl = `https://nomads.ncep.noaa.gov/pub/data/nccf/radar/nexrad_level2/${code}/${filename}`;
      const t0 = performance.now();
      setStatus(`⏳ Downloading ${filename} …`);
      const resp = await fetchViaRedirect(fileUrl);

      let arrayBuffer;
      try {
        arrayBuffer = await resp.arrayBuffer();
      } catch (bodyErr) {
        // If this still fails after switching to the edge-function proxy,
        // it means the connection genuinely dropped mid-stream (NOAA-side
        // hiccup, flaky network, etc) rather than a size-cap truncation -
        // surface that distinction clearly instead of a bare "Failed to fetch".
        throw new Error(`Connection dropped while downloading the file body: ${bodyErr.message}`);
      }
      const compressed = new Uint8Array(arrayBuffer);
      debugLog(`Downloaded ${(compressed.length/1024/1024).toFixed(2)} MB in ${(performance.now()-t0).toFixed(0)}ms`);
      if (compressed.length === 0) throw new Error('Downloaded 0 bytes - empty response body');

      // Yield one frame so the browser can actually paint the status
      // update above before we block the main thread with synchronous
      // bzip2 decompression (which can take real time on multi-MB files).
      setStatus(`⏳ Decompressing ${filename} …`);
      await new Promise(r => setTimeout(r, 0));

      const t1 = performance.now();
      let decompressed;
      try {
        decompressed = bzip2.simple(compressed);
        debugLog(`Decompressed (simple) to ${(decompressed.length/1024/1024).toFixed(2)} MB in ${(performance.now()-t1).toFixed(0)}ms`);
      } catch (bzErr) {
        debugLog(`bzip2.simple failed (${bzErr.message}), trying streaming fallback`);
        const stream = new bzip2.Bzip2Stream(compressed);
        const chunks = [];
        let chunk;
        let guard = 0;
        const GUARD_MAX = 200000; // hard cap so a misbehaving stream can't hang forever
        while ((chunk = stream.read(8192)) !== null) {
          chunks.push(chunk);
          if (++guard > GUARD_MAX) throw new Error('BZ2 streaming fallback exceeded safety limit');
        }
        const totalLen = chunks.reduce((a, c) => a + c.length, 0);
        decompressed = new Uint8Array(totalLen);
        let offset = 0;
        for (const c of chunks) { decompressed.set(c, offset); offset += c.length; }
        debugLog(`Decompressed (streaming) to ${(decompressed.length/1024/1024).toFixed(2)} MB in ${(performance.now()-t1).toFixed(0)}ms`);
      }

      // Yield again before the (also synchronous) radar parsing step.
      setStatus(`⏳ Parsing ${filename} …`);
      await new Promise(r => setTimeout(r, 0));

      const t2 = performance.now();
      // Level2Radar's constructor returns a Promise (see its README:
      // `new Level2Radar(rawData).then(radar => ...)`), so awaiting
      // the `new` expression directly works fine here.
      const radar = await new window.nexradLevel2Data.Level2Radar(decompressed.buffer);
      debugLog(`Parsed radar in ${(performance.now()-t2).toFixed(0)}ms`);

      // A NEXRAD volume has several elevations (tilts). Pick the
      // lowest one - it's the standard base reflectivity view.
      const elevations = radar.listElevations();
      if (!elevations || elevations.length === 0) throw new Error('No elevations found in file');
      const chosenElevation = elevations[0];
      radar.setElevation(chosenElevation);
      debugLog(`Elevations: [${elevations.join(', ')}] -> using ${chosenElevation}`);

      // IMPORTANT: getHighresReflectivity() objects do NOT contain an
      // azimuth field - azimuths are a separate, parallel array from
      // getAzimuth(). Both must be called with no `scan` argument to
      // get every radial in the selected elevation.
      let reflectivity = radar.getHighresReflectivity();
      let azimuths = radar.getAzimuth();
      if (!Array.isArray(reflectivity)) reflectivity = [reflectivity];
      if (!Array.isArray(azimuths)) azimuths = [azimuths];

      if (!reflectivity.length || !reflectivity[0] || !reflectivity[0].moment_data) {
        throw new Error('No reflectivity data for this elevation');
      }

      debugLog(`Radials: ${reflectivity.length}, azimuths: ${azimuths.length}`);
      const first = reflectivity[0];
      debugLog(`gate_count=${first.gate_count} gate_size=${first.gate_size} first_gate=${first.first_gate} scale=${first.scale} offset=${first.offset}`);
      if (first.moment_data && first.moment_data.length) {
        debugLog(`First 10 raw moment values: ${Array.from(first.moment_data.slice(0, 10)).join(', ')}`);
      }

      parsed = { reflectivity, azimuths, radar };
      state.parsedDataCache.set(filename, parsed);
    }
    const success = renderRadarData(parsed.reflectivity, parsed.azimuths, code);
    if (success) {
      timeSlider.value = state.currentIndex;
      timeIndex.textContent = `${state.currentIndex + 1} / ${state.fileList.length}`;
      setStatus(`✓ ${code} · ${filename}`, true);
      legendEl.classList.add('visible');
    } else {
      debugLog('Rendering produced 0 pixels – falling back to composite');
      loadCompositeFallback(code);
    }
    return success;
  } catch (err) {
    console.error('Load error:', err);
    debugLog(`ERROR: ${err.message}`);
    setStatus(`✗ ${filename} · ${err.message}`, false);
    if (state.currentIndex === 0) loadCompositeFallback(code);
    return false;
  } finally {
    hideLoading();
  }
}

// ─── Render Radar Data (returns true if any pixel drawn) ────────
function renderRadarData(reflectivity, azimuths, siteCode) {
  if (state.radarLayer) map.removeLayer(state.radarLayer);
  if (state.compositeLayer) map.removeLayer(state.compositeLayer);
  const site = getSiteByCode(siteCode);
  if (!site) return false;

  const maxRange = 230; // km
  const pixelSize = 0.5;
  const size = Math.ceil(maxRange * 2 / pixelSize);
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const dbzColors = [
    { max:0, color:[40,55,85] }, { max:10, color:[55,95,150] }, { max:20, color:[60,150,140] },
    { max:30, color:[110,190,80] }, { max:40, color:[210,210,60] }, { max:45, color:[230,170,40] },
    { max:50, color:[230,110,35] }, { max:55, color:[220,70,35] }, { max:60, color:[190,35,45] },
    { max:70, color:[130,25,55] }
  ];
  function getDbzColor(dbz) {
    if (dbz === null || dbz < -5) return [0,0,0,0];
    for (const r of dbzColors) if (dbz <= r.max) return [...r.color, 235];
    return [110,25,65,235];
  }

  const half = size/2;
  let pixelsDrawn = 0;
  let unitsLogged = false;

  for (let ri = 0; ri < reflectivity.length; ri++) {
    const radial = reflectivity[ri];
    const azDeg = azimuths[ri];
    if (!radial || !radial.moment_data || azDeg === undefined || azDeg === null) continue;

    const az = azDeg * Math.PI / 180;
    const data = radial.moment_data;
    const scale = radial.scale || 1;
    const offset = radial.offset || 0;

    // first_gate/gate_size are reported by the radar in meters; the
    // canvas math below is in km, so convert if the values look like
    // meters (i.e. bigger than any real km distance for these fields).
    let firstGateKm = radial.first_gate || 0;
    let gateSizeKm = radial.gate_size || 0.25;
    if (firstGateKm > 50) firstGateKm /= 1000;
    if (gateSizeKm > 50) gateSizeKm /= 1000;
    if (!unitsLogged) {
      debugLog(`Using firstGate=${firstGateKm.toFixed(3)}km gateSize=${gateSizeKm.toFixed(3)}km`);
      unitsLogged = true;
    }

    for (let i=0; i<data.length; i++) {
      const raw = data[i];
      // Per NEXRAD convention, raw values of 0 (below threshold) and
      // 1 (range folded) carry no usable reflectivity - skip them.
      if (raw === null || raw === undefined || raw <= 1) continue;
      const dbz = (raw - offset) / scale;
      const range = firstGateKm + i * gateSizeKm;
      if (range > maxRange) break;
      const x = half + Math.sin(az) * range / pixelSize;
      const y = half - Math.cos(az) * range / pixelSize;
      const r = Math.max(1.2, 1.8 - range / maxRange * 0.8);
      const color = getDbzColor(dbz);
      if (color[3] === 0) continue;
      ctx.fillStyle = `rgba(${color[0]},${color[1]},${color[2]},${color[3]/255})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      pixelsDrawn++;
    }
  }
  debugLog(`Pixels drawn: ${pixelsDrawn}`);

  // Always draw a faint reference ring at the radar's max range, and a
  // center dot at the site itself, independent of whether any actual
  // reflectivity data was present. This lets you visually confirm the
  // overlay is correctly positioned/opaque even on a clear-weather day
  // with little or no real signal to draw.
  ctx.strokeStyle = 'rgba(120,170,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.arc(half, half, half - 2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(120,170,255,0.9)';
  ctx.beginPath();
  ctx.arc(half, half, 3, 0, Math.PI * 2);
  ctx.fill();

  // If no pixels drawn, draw a test pattern
  if (pixelsDrawn === 0) {
    debugLog('Drawing test pattern');
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(half, half, 100, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(half-50, half);
    ctx.lineTo(half+50, half);
    ctx.moveTo(half, half-50);
    ctx.lineTo(half, half+50);
    ctx.stroke();
    for (let i=0; i<36; i++) {
      const angle = i * 10 * Math.PI / 180;
      ctx.beginPath();
      ctx.moveTo(half, half);
      ctx.lineTo(half + Math.sin(angle)*180, half - Math.cos(angle)*180);
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No radar data', half, half-20);
    ctx.fillText('(test pattern)', half, half+20);
  }

  const latDeg = maxRange / 111;
  const lonDeg = maxRange / (111 * Math.cos(site.lat * Math.PI / 180));
  const bounds = L.latLngBounds([site.lat - latDeg, site.lon - lonDeg], [site.lat + latDeg, site.lon + lonDeg]);
  const overlay = L.imageOverlay(canvas.toDataURL('image/png'), bounds, { opacity: 0.8, interactive: false, pane: 'overlayPane' });
  overlay.addTo(map);
  state.radarLayer = overlay;

  return pixelsDrawn > 0;
}

// ─── Composite Radar Fallback ────────────────────────────────────
function loadCompositeFallback(code) {
  if (state.compositeLayer) map.removeLayer(state.compositeLayer);
  const site = getSiteByCode(code);
  if (!site) return;
  const url = 'https://radar.weather.gov/Overlays/Current/Conus/RadarComposite_Conus.gif';
  const bounds = [[22, -130], [52, -60]];
  const overlay = L.imageOverlay(url, bounds, { opacity: 0.7, interactive: false, pane: 'overlayPane' });
  overlay.addTo(map);
  state.compositeLayer = overlay;
  setStatus(`🌎 Composite (fallback)`, true);
  legendEl.classList.add('visible');
}

// ─── Time Controls ──────────────────────────────────────────────────
function goToIndex(idx) {
  if (idx < 0 || idx >= state.fileList.length || state.loading) return;
  state.currentIndex = idx;
  loadRadarFile(state.selectedSite, state.fileList[idx]);
}
function nextFrame() {
  const next = state.currentIndex + 1;
  if (next < state.fileList.length) goToIndex(next);
  else stopPlayback();
}
function prevFrame() {
  const prev = state.currentIndex - 1;
  if (prev >= 0) goToIndex(prev);
}
function togglePlayback() {
  if (state.isPlaying) stopPlayback();
  else startPlayback();
}
function startPlayback() {
  if (state.fileList.length < 2) return;
  state.isPlaying = true;
  btnPlay.textContent = '⏸'; btnPlay.classList.add('playing');
  state.playInterval = setInterval(() => {
    nextFrame();
    if (state.currentIndex >= state.fileList.length - 1) stopPlayback();
  }, 700);
}
function stopPlayback() {
  if (state.playInterval) clearInterval(state.playInterval);
  state.isPlaying = false;
  btnPlay.textContent = '▶'; btnPlay.classList.remove('playing');
}

// ─── Refresh ──────────────────────────────────────────────────────
function refreshCurrent() {
  if (state.selectedSite) {
    state.parsedDataCache.clear();
    selectSite(state.selectedSite);
  }
}

// ─── Init ──────────────────────────────────────────────────────────
function init() {
  buildSitePills();
  createAllSiteMarkers();
  const defaultSite = RADAR_SITES.find(s => s.code === state.selectedSite) || RADAR_SITES[0];
  state.selectedSite = defaultSite.code;
  map.setView([defaultSite.lat, defaultSite.lon], 7);
  updateSiteMarkerHighlight(state.selectedSite);
  fetchFileList(state.selectedSite);

  btnRefresh.addEventListener('click', refreshCurrent);
  btnPrev.addEventListener('click', prevFrame);
  btnNext.addEventListener('click', nextFrame);
  btnPlay.addEventListener('click', togglePlayback);
  timeSlider.addEventListener('input', (e) => {
    if (state.loading) return;
    const idx = parseInt(e.target.value);
    if (idx !== state.currentIndex) { stopPlayback(); goToIndex(idx); }
  });
  window.addEventListener('resize', () => map.invalidateSize());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextFrame(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevFrame(); }
    if (e.key === ' ') { e.preventDefault(); togglePlayback(); }
    if (e.key === 'r' || e.key === 'R') refreshCurrent();
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
