# If you already have a netlify.toml, merge this in rather than replacing
# your file wholesale. The two things that matter for this fix:
#
# 1. Make sure there is NO [[redirects]] rule proxying /api/nomads/* to
#    https://nomads.ncep.noaa.gov directly (e.g. `to = "https://nomads..."`,
#    `status = 200`, `force = true`). That's the old path that goes through
#    Netlify's Lambda-based proxy layer and gets capped at 6-20MB, which is
#    what's truncating your radar files. Delete that rule if you have it.
#
# 2. The [[edge_functions]] block below is technically redundant with the
#    `export const config = { path: "/api/nomads/*" }` line already in
#    netlify/edge-functions/nexrad-proxy.js - Netlify will pick either one
#    up. Having both declared is harmless and just makes the routing
#    explicit/visible here too.

[[edge_functions]]
  path = "/api/nomads/*"
  function = "nexrad-proxy"

[build]
  publish = "."
